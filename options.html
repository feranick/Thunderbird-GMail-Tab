<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: sans-serif;
      font-size: 14px;
      padding: 16px;
      min-width: 320px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .desc {
      color: #555;
      font-size: 12px;
      margin-top: 4px;
    }
    #status {
      color: #2a7d2a;
      font-size: 12px;
      height: 14px;
    }
  </style>
</head>
<body>
  <div class="row">
    <input type="checkbox" id="notificationsEnabled">
    <label for="notificationsEnabled">Show notifications for new email</label>
  </div>
  <div class="desc">
    When enabled, a desktop notification appears when your Gmail unread count increases.
  </div>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
